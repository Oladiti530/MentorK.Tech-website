<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Signup - MentorK.Tech</title>
<style>
body{font-family:Arial;background:#0f0f0f;color:white;display:flex;justify-content:center;align-items:center;height:100vh}
.box{background:#1a1a1a;padding:30px;border-radius:12px;width:100%;max-width:360px}
input{width:100%;padding:12px;margin:8px 0;border-radius:8px;border:none}
button{width:100%;padding:12px;margin:8px 0;border-radius:8px;border:none;cursor:pointer;font-weight:bold}
.emailBtn{background:#2563eb;color:white}
.googleBtn{background:white;color:black}
</style>
</head>
<body>
<div class="box">
<h2>Create Account</h2>
<input id="email" type="email" placeholder="Email" />
<input id="password" type="password" placeholder="Password" />
<button class="emailBtn" id="signupBtn">Sign Up</button>
<button class="googleBtn" id="googleBtn">Continue with Google</button>
<p>Have account? <a href="login.html" style="color:#60a5fa">Login</a></p>
</div>
<script type="module">
import { signUp, loginWithGoogle } from "./js/auth.js";
document.getElementById("signupBtn").onclick = () => signUp(document.getElementById("email").value, document.getElementById("password").value);
document.getElementById("googleBtn").onclick = loginWithGoogle;
</script>
</body>
</html>
